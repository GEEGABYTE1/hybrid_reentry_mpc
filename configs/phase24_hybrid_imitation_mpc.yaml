seed: 240
phase5_config: configs/phase5_monte_carlo.yaml
phase1_config: configs/phase1_open_loop.yaml
phase2_config: configs/phase2_reference.yaml
phase23_oracle_summary: outputs/phase23_feasibility_ceiling_audit/phase23_oracle_summary.csv
phase23_oracle_trajectories: outputs/phase23_feasibility_ceiling_audit/phase23_oracle_trajectories.csv
phase22_output_dir: outputs/phase22_actuator_aware_slack_mpc
phase23_output_dir: outputs/phase23_feasibility_ceiling_audit
scenario_count_per_tier: 30
max_time_s: 40.0
policy:
  ridge_lambda: 0.001
  use_only_feasible_or_near_feasible: true
  feature_columns:
    - alpha_error_to_center_rad
    - q_radps
    - alpha_margin_low_rad
    - alpha_margin_high_rad
    - alpha_min_rate_radps
    - alpha_max_rate_radps
    - mach_scaled
    - dynamic_pressure_scaled
    - actuator_tau_s
  safety_blend_gain: 5.0
  safety_margin_rad: 0.020
  command_clip_rad: 0.35
variants:
  - name: hybrid_warm_start_slack_mpc
    control_dt_s: 1.0
    horizon_steps: 6
    alpha_buffer_rad: 0.0
    terminal_center_weight: 3000.0
    command_prior_weight: 0.0
    blend_initial_command: false
    weights:
      alpha_slack: 120000000.0
      q_slack: 8000000.0
      alpha_center: 1500.0
      q_center: 350.0
      theta_tracking: 1.0
      command: 0.025
      command_rate: 0.25
  - name: hybrid_prior_slack_mpc
    control_dt_s: 1.0
    horizon_steps: 6
    alpha_buffer_rad: 0.0
    terminal_center_weight: 3000.0
    command_prior_weight: 0.12
    blend_initial_command: false
    weights:
      alpha_slack: 120000000.0
      q_slack: 8000000.0
      alpha_center: 1500.0
      q_center: 350.0
      theta_tracking: 1.0
      command: 0.025
      command_rate: 0.25
  - name: hybrid_blended_slack_mpc
    control_dt_s: 1.0
    horizon_steps: 6
    alpha_buffer_rad: 0.0
    terminal_center_weight: 3000.0
    command_prior_weight: 0.05
    blend_initial_command: true
    weights:
      alpha_slack: 120000000.0
      q_slack: 8000000.0
      alpha_center: 1500.0
      q_center: 350.0
      theta_tracking: 1.0
      command: 0.025
      command_rate: 0.25
solver:
  max_iter: 45
  acceptable_tol: 1.0e-5
  print_level: 0
failure_thresholds:
  controlled_recovery_max_alpha_miss_rad: 0.025
  controlled_recovery_max_q_miss_radps: 0.010
  controlled_recovery_max_alpha_abs_rad: 0.55
  controlled_recovery_max_q_abs_radps: 0.22
plot_settings:
  envelope_percentiles: [5.0, 95.0]
