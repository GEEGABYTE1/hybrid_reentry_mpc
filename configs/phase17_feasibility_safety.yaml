seed: 170
phase5_config: configs/phase5_monte_carlo.yaml
phase1_config: configs/phase1_open_loop.yaml
phase2_config: configs/phase2_reference.yaml
scenario_count_per_tier: 3
max_time_s: 80.0
early_window_s: 12.0
variants:
  - name: actuator_aware_safety_nmpc
    control_dt_s: 0.5
    horizon_steps: 6
    use_reference_governor: false
    alpha_buffer_rad: 0.005
    tracking_weight: 800.0
    q_weight: 4500.0
    theta_weight: 5.0
    center_weight: 12000.0
    terminal_center_weight: 30000.0
    slack_weight: 80000000.0
    command_weight: 0.04
    command_rate_weight: 0.6
  - name: governed_safety_nmpc
    control_dt_s: 0.5
    horizon_steps: 6
    use_reference_governor: true
    alpha_buffer_rad: 0.010
    tracking_weight: 250.0
    q_weight: 5200.0
    theta_weight: 5.0
    center_weight: 18000.0
    terminal_center_weight: 45000.0
    slack_weight: 120000000.0
    command_weight: 0.03
    command_rate_weight: 0.7
solver:
  max_iter: 60
  acceptable_tol: 1.0e-5
  print_level: 0
failure_thresholds:
  controlled_recovery_max_alpha_miss_rad: 0.025
  controlled_recovery_max_q_miss_radps: 0.010
  controlled_recovery_max_alpha_abs_rad: 0.55
  controlled_recovery_max_q_abs_radps: 0.22
plot_settings:
  envelope_percentiles: [5.0, 95.0]
