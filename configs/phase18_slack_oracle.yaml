seed: 180
phase5_config: configs/phase5_monte_carlo.yaml
phase1_config: configs/phase1_open_loop.yaml
phase2_config: configs/phase2_reference.yaml
scenario_count_per_tier: 6
max_time_s: 40.0
oracle:
  dt_s: 1.0
  horizon_steps: 40
  actuator_lag_scale: 1.0
  delay_as_lag_scale: 0.5
  alpha_slack_weight: 100000000.0
  q_slack_weight: 5000000.0
  command_weight: 0.02
  command_rate_weight: 0.2
  q_center_weight: 200.0
  alpha_center_weight: 1000.0
solver:
  max_iter: 120
  acceptable_tol: 1.0e-5
  print_level: 0
classification:
  feasible_alpha_miss_rad: 0.001
  near_feasible_alpha_miss_rad: 0.025
plot_settings:
  envelope_percentiles: [5.0, 95.0]
