seed: 200
phase5_config: configs/phase5_monte_carlo.yaml
phase1_config: configs/phase1_open_loop.yaml
phase2_config: configs/phase2_reference.yaml
scenario_count_per_tier: 30
max_time_s: 40.0
oracle:
  dt_s: 1.0
  horizon_steps: 40
  actuator_lag_scale: 1.0
  delay_as_lag_scale: 0.5
  alpha_slack_weight: 100000000.0
  q_slack_weight: 5000000.0
  command_weight: 0.02
  command_rate_weight: 0.2
  q_center_weight: 200.0
  alpha_center_weight: 1000.0
solver:
  max_iter: 120
  acceptable_tol: 1.0e-5
  print_level: 0
classification:
  feasible_alpha_miss_rad: 0.001
  near_feasible_alpha_miss_rad: 0.025
policy:
  ridge_lambda: 0.001
  feature_columns:
    - alpha_error_to_center_rad
    - q_radps
    - alpha_margin_low_rad
    - alpha_margin_high_rad
    - alpha_min_rate_radps
    - alpha_max_rate_radps
    - mach_scaled
    - dynamic_pressure_scaled
    - actuator_tau_s
  variants:
    - name: ridge_no_safety
      use_only_feasible_or_near_feasible: true
      train_on_strict_feasible_only: false
      safety_blend_gain: 0.0
      safety_margin_rad: 0.020
      command_clip_rad: 0.35
    - name: ridge_safety
      use_only_feasible_or_near_feasible: true
      train_on_strict_feasible_only: false
      safety_blend_gain: 5.0
      safety_margin_rad: 0.020
      command_clip_rad: 0.35
    - name: ridge_stronger_safety
      use_only_feasible_or_near_feasible: true
      train_on_strict_feasible_only: false
      safety_blend_gain: 8.0
      safety_margin_rad: 0.030
      command_clip_rad: 0.35
    - name: ridge_strict_train_safety
      use_only_feasible_or_near_feasible: true
      train_on_strict_feasible_only: true
      safety_blend_gain: 5.0
      safety_margin_rad: 0.020
      command_clip_rad: 0.35
failure_thresholds:
  controlled_recovery_max_alpha_miss_rad: 0.025
  controlled_recovery_max_q_miss_radps: 0.010
  controlled_recovery_max_alpha_abs_rad: 0.55
  controlled_recovery_max_q_abs_radps: 0.22
plot_settings:
  envelope_percentiles: [5.0, 95.0]
