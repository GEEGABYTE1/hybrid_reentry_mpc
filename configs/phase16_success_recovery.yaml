seed: 160
phase5_config: configs/phase5_monte_carlo.yaml
phase1_config: configs/phase1_open_loop.yaml
phase2_config: configs/phase2_reference.yaml
sweep_scenario_count_per_tier: 12
full_scenario_count_per_tier: 30
run_full_best_variants: false
max_time_s: null
controller_variants:
  - name: nominal_nmpc_2s
    control_dt_s: 2.0
    horizon_steps: 10
    alpha_weight_scale: 1.0
    q_weight_scale: 1.0
    terminal_alpha_weight_scale: 1.0
    state_slack_scale: 1.0
    control_weight_scale: 1.0
    flap_rate_weight_scale: 1.0
    planning_alpha_buffer_rad: 0.0
  - name: fast_nmpc_1s
    control_dt_s: 1.0
    horizon_steps: 10
    alpha_weight_scale: 1.0
    q_weight_scale: 1.0
    terminal_alpha_weight_scale: 1.0
    state_slack_scale: 1.0
    control_weight_scale: 1.0
    flap_rate_weight_scale: 1.0
    planning_alpha_buffer_rad: 0.0
  - name: fast_nmpc_0p5s
    control_dt_s: 0.5
    horizon_steps: 10
    alpha_weight_scale: 1.0
    q_weight_scale: 1.0
    terminal_alpha_weight_scale: 1.0
    state_slack_scale: 1.0
    control_weight_scale: 1.0
    flap_rate_weight_scale: 1.0
    planning_alpha_buffer_rad: 0.0
  - name: corridor_centered_nmpc
    control_dt_s: 0.5
    horizon_steps: 10
    alpha_weight_scale: 2.4
    q_weight_scale: 1.4
    terminal_alpha_weight_scale: 2.2
    state_slack_scale: 1.0
    control_weight_scale: 0.6
    flap_rate_weight_scale: 0.6
    planning_alpha_buffer_rad: 0.0
  - name: corridor_barrier_nmpc
    control_dt_s: 0.5
    horizon_steps: 10
    alpha_weight_scale: 2.0
    q_weight_scale: 1.3
    terminal_alpha_weight_scale: 2.0
    state_slack_scale: 3.0
    control_weight_scale: 0.7
    flap_rate_weight_scale: 0.7
    planning_alpha_buffer_rad: 0.015
  - name: success_recovery_nmpc
    control_dt_s: 0.5
    horizon_steps: 10
    alpha_weight_scale: 2.6
    q_weight_scale: 1.6
    terminal_alpha_weight_scale: 2.6
    state_slack_scale: 3.5
    control_weight_scale: 0.45
    flap_rate_weight_scale: 0.5
    planning_alpha_buffer_rad: 0.012
nmpc_base:
  weights:
    alpha: 6000.0
    q: 2200.0
    theta: 10.0
    control: 0.05
    flap_rate: 0.2
    terminal_alpha: 9000.0
    state_slack: 10000000.0
  solver:
    max_iter: 80
    acceptable_tol: 1.0e-5
    print_level: 0
plot_settings:
  envelope_percentiles: [5.0, 95.0]
